# Local stack. From the repo root:
#   docker compose -f infra/docker/docker-compose.yml up --build -d        (run everything)
#   docker compose -f infra/docker/docker-compose.yml --profile test run --rm api-test   (backend checks)
name: ufme

x-app-env: &app-env
  DATABASE_URL: postgresql+psycopg://ufme:ufme@postgres:5432/ufme
  REDIS_URL: redis://redis:6379/0
  ENVIRONMENT: local
  LOG_JSON: "true"
  CORS_ORIGINS: '["http://localhost:5173"]'
  SEED_DEMO: "true"
  UPLOAD_DIR: /data/uploads
  OLLAMA_URL: http://host.docker.internal:11434  # Ollama runs on the host GPU
  ASSIST_MODEL: gemma4:e4b-it-qat
  # Stage 5 sign-in: tokens from the local Keycloak (browser sees it on :8081, containers on keycloak:8080).
  AUTH_MODE: oidc
  OIDC_ISSUER: http://localhost:8081/realms/ufme
  OIDC_JWKS_URL: http://keycloak:8080/realms/ufme/protocol/openid-connect/certs
  OIDC_AUDIENCE: ufme-api
  EVIDENCE_SIGNING_KEY: ${EVIDENCE_SIGNING_KEY:-}  # from your shell / .env; empty = development key

services:
  postgres:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: ufme, POSTGRES_PASSWORD: ufme, POSTGRES_DB: ufme }
    # Defaults (128 MB cache, 1 GB WAL) checkpoint constantly during 300K-row COPYs; sized for a laptop.
    command: >-
      postgres -c shared_buffers=1GB -c effective_cache_size=3GB -c work_mem=32MB
      -c maintenance_work_mem=512MB -c max_wal_size=8GB -c checkpoint_timeout=15min
      -c wal_compression=on
    shm_size: 1gb
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres-init.sql:/docker-entrypoint-initdb.d/10-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ufme -d ufme"]
      interval: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 12

  keycloak:  # open-source OIDC identity provider (development mode; realm imported from infra/keycloak)
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}  # local only
      KC_HOSTNAME: http://localhost:8081
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_ENABLED: "true"
    ports: ["8081:8080"]
    volumes:
      - ../keycloak/ufme-realm.json:/opt/keycloak/data/import/ufme-realm.json:ro
      - ../keycloak/themes/ufme:/opt/keycloak/themes/ufme:ro  # ufme sign-in theme
    restart: unless-stopped

  api:
    build: { context: ../../services/api, target: runtime }
    environment: *app-env
    ports: ["8000:8000"]
    restart: unless-stopped
    volumes: [uploads:/data/uploads]
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  worker:
    build: { context: ../../services/api, target: runtime }
    restart: unless-stopped  # an OOM kill must not leave the queue without a worker
    command: celery -A app.workers.celery_app worker --loglevel=INFO --pool=threads --concurrency=2  # threads: a match run fans out to its own process pool
    environment: *app-env
    volumes: [uploads:/data/uploads]
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.workers.celery_app inspect ping -d celery@$$HOSTNAME --timeout 5 | grep -q pong"]
      interval: 15s
      timeout: 10s
      retries: 6
    depends_on:
      api: { condition: service_healthy }

  web:
    build: { context: ../.., dockerfile: apps/web/Dockerfile }
    environment:
      API_PROXY_TARGET: http://api:8000
      VITE_AUTH: oidc
      IDP_PROXY_TARGET: http://keycloak:8080
      VITE_OIDC_ISSUER: http://localhost:8081/realms/ufme
      VITE_OIDC_CLIENT_ID: ufme-web
      VITE_POLL: "true"  # file watching over Windows bind mounts needs polling
    ports: ["5173:5173"]
    volumes:
      - ../../apps/web/src:/repo/apps/web/src  # live reload of frontend edits
    depends_on:
      api: { condition: service_healthy }

  # ---- checks (profile: test) ----
  api-test:
    profiles: [test]
    build: { context: ../../services/api, target: test }
    environment:
      DATABASE_URL: postgresql+psycopg://ufme:ufme@postgres:5432/ufme_test
      MIGRATION_TEST_DATABASE_URL: postgresql+psycopg://ufme:ufme@postgres:5432/ufme_test
      ENVIRONMENT: test
    depends_on:
      postgres: { condition: service_healthy }

  web-test:
    profiles: [test]
    build: { context: ../.., dockerfile: apps/web/Dockerfile }
    command: ["npm", "run", "build"]

volumes:
  pgdata:
  uploads:
