# Local stack: docker compose -f infra/docker/docker-compose.yml up --build
name: ufme

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ufme
      POSTGRES_PASSWORD: ufme
      POSTGRES_DB: ufme
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ufme -d ufme"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  api:
    build: ../../services/api
    environment: &app-env
      DATABASE_URL: postgresql+psycopg://ufme:ufme@postgres:5432/ufme
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: local
      LOG_JSON: "true"
    ports: ["8000:8000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  worker:
    build: ../../services/api
    command: celery -A app.workers.celery_app worker --loglevel=INFO --concurrency=2
    environment: *app-env
    depends_on:
      api: { condition: service_healthy }

volumes:
  pgdata:
