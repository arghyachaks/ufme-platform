<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 560" role="img" aria-label="Two ledgers whose lines are matched to each other">
  <style>
    .ink{stroke:#00063d;fill:none;stroke-width:1.5}
    .card{fill:#ffffff;stroke:#00063d;stroke-width:1.5}
    .bar{fill:#00063d}
    .soft{fill:#d2ffc1}
    .link{stroke:#0a4733;stroke-width:2;fill:none;stroke-dasharray:240;stroke-dashoffset:240;animation:draw 6s cubic-bezier(.16,1,.3,1) infinite}
    .lock{fill:#0a4733;transform-box:fill-box;transform-origin:center;transform:scale(0);animation:lock 6s cubic-bezier(.34,1.56,.64,1) infinite}
    .rowA,.rowB{animation:settle 6s ease-in-out infinite}
    .px{fill:#00063d;animation:blink 3s steps(2) infinite}
    .px.g{fill:#0a4733}
    .float{animation:float 7s ease-in-out infinite}
    .d1{animation-delay:.2s}.d2{animation-delay:.9s}.d3{animation-delay:1.6s}.d4{animation-delay:2.3s}.d5{animation-delay:3s}
    @keyframes draw{0%,8%{stroke-dashoffset:240}35%,82%{stroke-dashoffset:0}100%{stroke-dashoffset:-240}}
    @keyframes lock{0%,30%{transform:scale(0)}40%,82%{transform:scale(1)}92%,100%{transform:scale(0)}}
    @keyframes settle{0%,100%{opacity:.55}35%,85%{opacity:1}}
    @keyframes blink{0%{opacity:1}50%{opacity:.15}}
    @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
    @media (prefers-reduced-motion: reduce){*{animation:none!important}.link{stroke-dashoffset:0}.lock{transform:scale(1)}}
  </style>

  <!-- pixel corners, as in an editorial print grid -->
  <g>
    <rect class="px" x="24" y="24" width="10" height="10"/><rect class="px g d2" x="34" y="34" width="10" height="10"/><rect class="px d4" x="24" y="44" width="10" height="10"/>
    <rect class="px d1" x="606" y="24" width="10" height="10"/><rect class="px g d3" x="596" y="34" width="10" height="10"/>
    <rect class="px d3" x="24" y="506" width="10" height="10"/><rect class="px g" x="34" y="496" width="10" height="10"/>
    <rect class="px d5" x="606" y="526" width="10" height="10"/><rect class="px g d1" x="596" y="516" width="10" height="10"/><rect class="px d2" x="606" y="506" width="10" height="10"/>
  </g>

  <!-- ledger A -->
  <g class="float">
    <rect class="card" x="60" y="110" width="200" height="300" rx="2"/>
    <rect class="bar" x="78" y="128" width="60" height="8"/>
    <g class="rowA d1"><rect class="soft" x="78" y="160" width="164" height="34"/><rect class="bar" x="88" y="172" width="70" height="6"/><rect class="bar" x="200" y="172" width="32" height="6"/></g>
    <g class="rowA d2"><rect class="soft" x="78" y="204" width="164" height="34"/><rect class="bar" x="88" y="216" width="54" height="6"/><rect class="bar" x="190" y="216" width="42" height="6"/></g>
    <g class="rowA d3"><rect class="soft" x="78" y="248" width="164" height="34"/><rect class="bar" x="88" y="260" width="80" height="6"/><rect class="bar" x="206" y="260" width="26" height="6"/></g>
    <g class="rowA d4"><rect class="soft" x="78" y="292" width="164" height="34"/><rect class="bar" x="88" y="304" width="62" height="6"/><rect class="bar" x="196" y="304" width="36" height="6"/></g>
    <g class="rowA d5"><rect class="soft" x="78" y="336" width="164" height="34"/><rect class="bar" x="88" y="348" width="48" height="6"/><rect class="bar" x="204" y="348" width="28" height="6"/></g>
  </g>

  <!-- ledger B -->
  <g class="float d3">
    <rect class="card" x="380" y="150" width="200" height="300" rx="2"/>
    <rect class="bar" x="398" y="168" width="60" height="8"/>
    <g class="rowB d2"><rect class="soft" x="398" y="200" width="164" height="34"/><rect class="bar" x="408" y="212" width="70" height="6"/><rect class="bar" x="520" y="212" width="32" height="6"/></g>
    <g class="rowB d1"><rect class="soft" x="398" y="244" width="164" height="34"/><rect class="bar" x="408" y="256" width="54" height="6"/><rect class="bar" x="510" y="256" width="42" height="6"/></g>
    <g class="rowB d4"><rect class="soft" x="398" y="288" width="164" height="34"/><rect class="bar" x="408" y="300" width="80" height="6"/><rect class="bar" x="526" y="300" width="26" height="6"/></g>
    <g class="rowB d3"><rect class="soft" x="398" y="332" width="164" height="34"/><rect class="bar" x="408" y="344" width="62" height="6"/><rect class="bar" x="516" y="344" width="36" height="6"/></g>
    <g class="rowB d5"><rect class="soft" x="398" y="376" width="164" height="34"/><rect class="bar" x="408" y="388" width="48" height="6"/><rect class="bar" x="524" y="388" width="28" height="6"/></g>
  </g>

  <!-- matches being made: each line draws across, then locks with a green square -->
  <path class="link d1" d="M242 177 C 310 177, 330 261, 398 261"/>
  <path class="link d2" d="M242 221 C 310 221, 330 217, 398 217"/>
  <path class="link d3" d="M242 265 C 310 265, 330 349, 398 349"/>
  <path class="link d4" d="M242 309 C 310 309, 330 305, 398 305"/>
  <path class="link d5" d="M242 353 C 310 353, 330 393, 398 393"/>
  <rect class="lock d1" x="314" y="213" width="12" height="12"/>
  <rect class="lock d2" x="314" y="213" width="12" height="12" transform="translate(0,6)"/>
  <rect class="lock d3" x="314" y="301" width="12" height="12"/>
  <rect class="lock d4" x="314" y="301" width="12" height="12" transform="translate(0,6)"/>
  <rect class="lock d5" x="314" y="367" width="12" height="12"/>

  <!-- result chip -->
  <g class="float d2">
    <rect x="200" y="470" width="240" height="52" rx="26" fill="#00063d"/>
    <rect x="222" y="490" width="12" height="12" fill="#b3ed97"/>
    <text x="246" y="502" font-family="Georgia, 'Times New Roman', serif" font-size="20" fill="#ffffff">matched &amp; explained</text>
  </g>
</svg>
